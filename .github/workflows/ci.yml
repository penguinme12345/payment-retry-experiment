name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: make setup
      - run: make lint
      - run: make test

  pipeline:
    # Full pipeline from a clean checkout at 5k customers: simulate → dbt → design → analyze →
    # memo → export. Required to pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: make setup
      - run: make clean all SIM_CONFIG=config/sim.ci.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-outputs
          path: |
            reports/
            docs/memo.md
          if-no-files-found: warn
