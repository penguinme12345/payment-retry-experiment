version: 2

models:
  - name: metricflow_time_spine
    description: Daily date spine from `time_spine_start` to `time_spine_end` used by MetricFlow.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Calendar day.
        granularity: day
        data_tests: [unique, not_null]
