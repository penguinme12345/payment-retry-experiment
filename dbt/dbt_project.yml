name: retrylab
version: "1.0.0"
config-version: 2
profile: retrylab

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: ["target", "dbt_packages"]

vars:
  # Directory holding the raw Parquet tables, relative to PROJECT_ROOT (or absolute).
  # Tests override it: --vars '{raw_dir: tests/dbt/fixtures/raw}'
  raw_dir: data/raw
  experiment_id: retry_timing_v1
  # Experiment window (failed invoices created), contract C2.
  experiment_start: "2026-03-01"
  experiment_end: "2026-03-31"
  # Pre-period (historical invoices), contract C2. Both dates inclusive.
  pre_period_start: "2025-03-01"
  pre_period_end: "2026-02-28"
  # Observation windows in days after the initial failure (attempt 0). Upper bounds inclusive.
  recovery_window_days: 7
  ticket_window_days: 14
  churn_window_days: 30
  max_retries: 4
  # MetricFlow time spine bounds.
  time_spine_start: "2025-01-01"
  time_spine_end: "2026-12-31"

models:
  retrylab:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    utilities:
      +materialized: table

flags:
  send_anonymous_usage_stats: false
